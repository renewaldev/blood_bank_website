<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>RENEWAL ADMIN | Dashboard</title>
  
  <!-- CSS -->
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/admin.css" />

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

<!-- Mobile Topbar -->
<div class="admin-topbar">
  <div style="font-family:var(--font-bn);font-weight:700;color:var(--blood-red)">RENEWAL ADMIN</div>
  <button class="admin-hamburger" onclick="AdminModule.toggleSidebar()">
    <i class="fas fa-bars"></i>
  </button>
</div>

<!-- Main Layout Container -->
<div class="admin-layout">
  
  <!-- Sidebar Navigation -->
  <aside class="admin-sidebar" id="admin-sidebar">
    <div class="sidebar-header">
      <div class="brand-icon"><i class="fas fa-shield-halved"></i></div>
      <h2>RENEWAL ADMIN</h2>
      <div style="font-size:0.8rem;color:var(--text-muted);font-family:var(--font-bn)">কন্ট্রোল প্যানেল</div>
    </div>

    <nav class="sidebar-nav">
      <a class="sidebar-link active" data-tab="verif" onclick="AdminModule.switchTab('verif')"><i class="fas fa-hourglass-half"></i> যাচাই বাকি</a>
      <a class="sidebar-link" data-tab="emergency" onclick="AdminModule.switchTab('emergency')"><i class="fas fa-triangle-exclamation"></i> জরুরি অনুরোধ</a>
      <a class="sidebar-link" data-tab="contact" onclick="AdminModule.switchTab('contact')"><i class="fas fa-phone"></i> যোগাযোগ অনুরোধ</a>
      <a class="sidebar-link" data-tab="blood" onclick="AdminModule.switchTab('blood')"><i class="fas fa-droplet"></i> রক্তের গ্রুপ</a>
      <a class="sidebar-link" data-tab="donors" onclick="AdminModule.switchTab('donors')"><i class="fas fa-users"></i> সব দাতা</a>
      <a class="sidebar-link" data-tab="chart" onclick="AdminModule.switchTab('chart')"><i class="fas fa-chart-line"></i> ট্রেন্ড</a>
    </nav>

    <div class="sidebar-footer">
      <a class="sidebar-link" style="color:var(--blood-red)" onclick="DataStore.logout()"><i class="fas fa-right-from-bracket"></i> লগআউট</a>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="admin-main">
    
    <!-- Admin Overview Stats -->
    <div class="compact-stats-grid" id="admin-stats-grid">
      <!-- Rendered by JS -->
    </div>

    <!-- Tab: Pending Verifications -->
    <div class="admin-tab-pane active" id="atab-verif">
      <div class="admin-section">
        <div class="admin-section-header">
          <i class="fas fa-hourglass-half" style="color:var(--pending-amber)"></i> যাচাই বাকি আছে এমন দাতা
        </div>
        <div class="admin-section-content" id="pending-verif-list">
          <!-- Rendered by JS -->
        </div>
      </div>
    </div>

    <!-- Tab: Emergency Queue -->
    <div class="admin-tab-pane" id="atab-emergency">
      <div class="admin-section">
        <div class="admin-section-header">
          <i class="fas fa-triangle-exclamation" style="color:var(--blood-red)"></i> জরুরি রক্তের অনুরোধ ব্যবস্থাপনা
        </div>
        <div class="admin-section-content" id="admin-emergency-queue">
          <!-- Rendered by JS -->
        </div>
      </div>
    </div>

    <!-- Tab: Contact Requests -->
    <div class="admin-tab-pane" id="atab-contact">
      <div class="admin-section">
        <div class="admin-section-header">
          <i class="fas fa-phone" style="color:var(--status-review)"></i> দাতার সাথে যোগাযোগের অনুরোধ
        </div>
        <div class="admin-section-content" id="admin-contact-requests">
          <!-- Rendered by JS -->
        </div>
      </div>
    </div>

    <!-- Tab: Blood Group Stats -->
    <div class="admin-tab-pane" id="atab-blood">
      <div class="admin-section">
        <div class="admin-section-header">
          <i class="fas fa-droplet" style="color:var(--blood-red)"></i> রক্তের গ্রুপ পরিসংখ্যান
        </div>
        <div class="admin-section-content" id="blood-group-stats">
          <!-- Rendered by JS -->
        </div>
      </div>
    </div>

    <!-- Tab: All Donors -->
    <div class="admin-tab-pane" id="atab-donors">
      <div class="admin-section">
        <div class="admin-section-header">
          <i class="fas fa-users" style="color:var(--text-primary)"></i> সকল রক্তদাতা
        </div>
        <div class="admin-section-content" id="admin-all-donors">
          <!-- Rendered by JS -->
        </div>
      </div>
    </div>

    <!-- Tab: Chart -->
    <div class="admin-tab-pane" id="atab-chart">
      <div class="admin-section">
        <div class="admin-section-header">
          <i class="fas fa-chart-line" style="color:var(--blood-red)"></i> নিবন্ধন ট্রেন্ড
        </div>
        <div class="admin-section-content">
          <canvas id="donation-trend-chart" style="max-height:300px;width:100%"></canvas>
        </div>
      </div>
    </div>

  </main>
</div>

<script src="js/data.js?v=3"></script>
<script src="js/app.js?v=3"></script>
<script src="js/admin.js?v=3"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    DataStore.init().then(() => {
      AdminModule.render();
      AdminModule.switchTab('verif');
    });
  });
</script>
</body>
</html>
